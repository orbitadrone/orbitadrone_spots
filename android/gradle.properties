org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
android.enableJetifier=true
hermesEnabled=true
# Default to all ABIs. Override locally with -PreactNativeArchitectures=arm64-v8a
# when you need an arm64-only build (smaller, focused on 16KB devices).
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
edgeToEdgeEnabled=false
android.suppressUnsupportedCompileSdk=34,35,36

# Define signing secrets through environment variables, keystore.properties (gitignored)
# or Gradle -P flags. Keys are intentionally omitted from version control.
systemProp.java.net.preferIPv4Stack=true
